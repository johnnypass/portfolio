let activeId = null;
function toggleAudio(pk, btn) {
  const wrap = document.getElementById('audio-' + pk);
  if (activeId && activeId !== pk) {
    document.getElementById('audio-' + activeId).classList.remove('visible');
    const oldBtn = document.querySelector('[data-pk="' + activeId + '"]');
    if (oldBtn) { oldBtn.classList.remove('active'); oldBtn.textContent = '\u25b6 Listen'; }
    const oldAudio = document.querySelector('#audio-' + activeId + ' audio');
    if (oldAudio) oldAudio.pause();
  }
  if (wrap.classList.contains('visible')) {
    wrap.classList.remove('visible'); btn.classList.remove('active'); btn.textContent = '\u25b6 Listen';
    wrap.querySelector('audio').pause(); activeId = null;
  } else {
    wrap.classList.add('visible'); btn.classList.add('active'); btn.textContent = '\u2715 Close'; activeId = pk;
  }
}
document.getElementById('grid').innerHTML = articles.map((a, i) => `
  <div class="card" style="animation-delay:${i*0.04}s">
    <div class="card-img-wrap">
      <img class="card-img" src="${a.img}" alt="${a.title}" loading="lazy"
        onerror="this.parentElement.innerHTML='<div class=\'card-img-placeholder\'>WNYC</div>'">
    </div>
    <div class="card-body">
      <div class="card-title">${a.title}</div>
      <div class="card-tease">${a.tease}</div>
      <div class="card-actions">
        <button class="btn" data-pk="${a.pk}" onclick="toggleAudio(${a.pk}, this)">&#9654; Listen</button>
        <a class="btn" href="${a.url}" target="_blank" rel="noopener">&#8599; wnyc.org</a>
      </div>
      <div class="audio-wrap" id="audio-${a.pk}">
        <audio controls preload="none"><source src="${a.audio}" type="audio/mpeg"></audio>
      </div>
    </div>
  </div>`).join('');
</script>
